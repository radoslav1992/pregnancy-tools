name: CI

# Build + type-check on every push and pull request. This validates the site
# only — it does NOT deploy, so it won't conflict with Cloudflare's Git builds.
on:
  push:
    branches-ignore:
      - main # main is built & deployed by Cloudflare; no need to double-build
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (astro check)
        run: npx astro check

      - name: Build
        run: npm run build
